<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oluwadamipe — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>

  <main class="card">

    <div class="card__cover"></div>

    <!-- Theme switch: a track with a sliding knob.
         Sun on the left = light, moon on the right = dark. -->
    <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="theme-toggle__knob" aria-hidden="true"></span>
      <svg class="theme-toggle__icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="theme-toggle__icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>

    <div class="card__avatar">O</div>

    <h1 class="card__name">Oluwadamipe</h1>
    <p class="card__role">Product Designer</p>

    <p class="card__bio">
      I design clear, friendly interfaces and I'm learning to bring them to life in code.
    </p>

    <ul class="card__tags">
      <li>UI Design</li>
      <li>Figma</li>
      <li>Prototyping</li>
      <li>HTML &amp; CSS</li>
    </ul>

    <div class="card__stats">
      <div>
        <strong>24</strong>
        <span>Projects</span>
      </div>
      <div>
        <strong>5 yrs</strong>
        <span>Experience</span>
      </div>
      <div>
        <strong>12</strong>
        <span>Clients</span>
      </div>
    </div>

    <div class="card__actions">
      <a class="button button--primary" href="#">Get in touch</a>
      <a class="button button--secondary" href="https://github.com/Oluwadamipe" target="_blank">GitHub</a>
    </div>

  </main>

</body>
</html>
